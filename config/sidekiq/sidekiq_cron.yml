memory_consolidation:
  cron: "0 */6 * * *"  # Every 6 hours
  class: "Jobs::MemoryConsolidationJob"
  queue: low
  description: "Consolidate and optimize memory storage"

host_registration:
  cron: "*/5 * * * *"  # Every 5 minutes
  class: "Jobs::HostRegistrationWorker"
  queue: default
  description: "Register Glitch Cube IP with Home Assistant for dynamic discovery"

personality_memory:
  cron: "*/30 * * * *"  # Every 30 minutes
  class: "Jobs::PersonalityMemoryJob"
  queue: low
  description: "Extract and store interesting memories from recent conversations"

personal_summarizer:
  cron: "5 * * * *"  # 5 minutes past every hour
  class: "Jobs::PersonalSummarizerJob"
  queue: summaries
  description: "Summarize cube's internal state and thoughts from the past hour"

interaction_summarizer:
  cron: "10 * * * *"  # 10 minutes past every hour
  class: "Jobs::InteractionSummarizerJob"
  queue: summaries
  description: "Summarize social dynamics and human interactions from the past hour"

event_memory_summarizer:
  cron: "15 * * * *"  # 15 minutes past every hour
  class: "Jobs::EventMemorySummarizerJob"
  queue: summaries
  description: "Identify and summarize significant moments from the past hour"

daily_summary:
  cron: "0 1 * * *"  # 1:00 AM every day
  class: "Jobs::DailySummaryJob"
  queue: summaries
  description: "Consolidate hourly summaries into comprehensive daily summary"

repeating_jobs_handler:
  cron: "*/5 * * * *"  # Every 5 minutes
  class: "Jobs::RepeatingJobsHandler"
  queue: default
  description: "Execute miscellaneous repeating services (weather, health checks, battery monitoring)"