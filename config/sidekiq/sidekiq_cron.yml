memory_consolidation:
  cron: "0 */6 * * *"  # Every 6 hours
  class: "Jobs::MemoryConsolidationJob"
  queue: low
  description: "Consolidate and optimize memory storage"

host_registration:
  cron: "*/5 * * * *"  # Every 5 minutes
  class: "HostRegistrationWorker"
  queue: default
  description: "Register Glitch Cube IP with Home Assistant for dynamic discovery"

personality_memory:
  cron: "*/30 * * * *"  # Every 30 minutes
  class: "Jobs::PersonalityMemoryJob"
  queue: low
  description: "Extract and store interesting memories from recent conversations"