# Updated to work with consolidated alert system
# Enhanced logging and additional actions for connectivity loss
# Persistent notifications are handled by the consolidated alert system

- id: internet_connectivity_alert
  alias: "Alert on Internet Connectivity Loss"
  description: "Enhanced logging and actions for connectivity loss (notifications handled by consolidated alerts)"
  trigger:
    - platform: state
      entity_id: sensor.internet_connectivity
      to: "disconnected"
      for:
        minutes: 5  # Alert after 5 minutes without internet
  action:
    # Enhanced logbook entry
    - service: logbook.log
      data:
        name: "Glitch Cube Alert"
        message: "🌐 Internet connectivity lost after 5 minutes - Starlink may be down. Switching to offline mode."
        domain: "glitchcube"
        entity_id: "sensor.internet_connectivity"
    
    # Auto-enable offline mode after extended connectivity loss
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.offline_mode