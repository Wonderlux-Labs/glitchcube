# Updated to work with consolidated alert system
# This automation now logs to logbook and triggers emergency actions
# Persistent notifications are handled by the consolidated alert system

- id: app_health_alert
  alias: "Alert on App Health Issues"
  description: "Logs app health issues and triggers emergency actions (notifications handled by consolidated alerts)"
  trigger:
    - platform: state
      entity_id: sensor.glitch_cube_app_health
      to: "offline"
      for:
        minutes: 2  # Alert after 2 minutes offline
  action:
    # Log to logbook for record keeping
    - service: logbook.log
      data:
        name: "Glitch Cube Alert"
        message: "🔴 App went offline after 2 minutes - Last seen: {{ as_timestamp(states.sensor.glitch_cube_app_health.last_changed) | timestamp_custom('%H:%M:%S') }}"
        domain: "glitchcube"
        entity_id: "sensor.glitch_cube_app_health"
    
    # Optional: Trigger additional emergency actions if needed
    # - service: script.turn_on
    #   target:
    #     entity_id: script.emergency_restart_sequence