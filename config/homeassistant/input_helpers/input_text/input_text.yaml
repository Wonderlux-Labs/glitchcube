# Input Text helpers for Glitch Cube
current_persona:
  name: "Current AI Persona"
  max: 100
  initial: "buddy"
  
current_environment:
  name: "Current Environment"
  max: 255
  initial: "Unknown location"
  icon: "mdi:map-marker-radius"
  
current_weather:
  name: "Current Weather Summary"
  max: 255
  initial: "Weather data unavailable"
  icon: "mdi:weather-partly-cloudy"

glitchcube_host:
  name: "Glitch Cube Host IP"
  initial: "192.168.0.99"  # Default fallback IP - should be 192.168.0.99 in production
  min: 7                   # Minimum length for IP (x.x.x.x)
  max: 15                  # Maximum length for IP (xxx.xxx.xxx.xxx)
  icon: mdi:cube-outline
  mode: text

camera_vision_analysis:
  name: "Camera Vision Analysis"
  max: 255
  initial: "No analysis available"
  icon: "mdi:camera-iris"