- id: '1755159655071'
  alias: Cube Light (voice)
  description: Voice assistant feedback lighting with scene restoration
  triggers:
  - trigger: state
    entity_id: assist_satellite.square_voice
    from: idle
    id: voice_activated
  - trigger: state
    entity_id: assist_satellite.square_voice
    to: listening
    id: listening
  - trigger: state
    entity_id: assist_satellite.square_voice
    to: processing
    id: processing
  - trigger: state
    entity_id: assist_satellite.square_voice
    to: speaking
    id: speaking
  - trigger: state
    entity_id: assist_satellite.square_voice
    to: idle
    for:
      seconds: 2
    id: voice_idle
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: voice_activated
      sequence:
      - action: scene.create
        data:
          scene_id: cube_voice_restore
          snapshot_entities:
          - light.cube_light
    - conditions:
      - condition: trigger
        id: listening
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.cube_light
        data:
          rgb_color: '{{ listening_color }}'
          brightness_pct: 80
          transition: 0.3
  variables:
    listening_color:
    - 0
    - 255
    - 0
    processing_color:
    - 0
    - 0
    - 255
    speaking_color:
    - 128
    - 0
    - 128
  mode: parallel
- id: '1755164988353'
  alias: GPS - Current Cube Location
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - action: rest_command.update_location_context
    metadata: {}
    data: {}
    response_variable: location_response
  - action: input_text.set_value
    metadata: {}
    data:
      value: '{{ location_response }}'
    target:
      entity_id: input_text.current_location
  mode: single
- id: '1755313710558'
  alias: Persona Switcher
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_text.current_persona
    from:
    to:
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_text.current_persona
        state: jax
      sequence:
      - action: select.select_option
        data:
          option: JAX
        target:
          entity_id:
          - select.home_assistant_voice_09739d_assistant
          - select.esp32_s3_box_3_52b3dc_assistant
    - conditions:
      - condition: state
        entity_id: input_text.current_persona
        state: buddy
      sequence:
      - action: select.select_option
        data:
          option: BUDDY
        target:
          entity_id:
          - select.home_assistant_voice_09739d_assistant
          - select.esp32_s3_box_3_52b3dc_assistant
    - conditions:
      - condition: state
        entity_id: input_text.current_persona
        state: lomi
      sequence:
      - action: select.select_option
        data:
          option: LOMI
        target:
          entity_id:
          - select.home_assistant_voice_09739d_assistant
          - select.esp32_s3_box_3_52b3dc_assistant
    - conditions:
      - condition: state
        entity_id: input_text.current_persona
        state: zorp
      sequence:
      - action: select.select_option
        data:
          option: ZORP
        target:
          entity_id:
          - select.home_assistant_voice_09739d_assistant
          - select.esp32_s3_box_3_52b3dc_assistant
  mode: single
