# Weather Package - Everything weather-related in one place!

###############################################################################
# INPUT HELPERS
###############################################################################
input_text:
  weather_forecast_24h:
    name: 24 Hour Weather Forecast
    initial: "No forecast available"
    max: 255

  weather_forecast_5day:
    name: 5 Day Weather Forecast
    initial: "No forecast available"
    max: 255

input_button:
  update_weather_context:
    name: Update Weather Context
    icon: mdi:weather-partly-cloudy

###############################################################################
# TEMPLATE SENSORS
###############################################################################
template:
  - sensor:
    - name: "Weather Summary"
      state: >
        {% set current = states('sensor.playaweather_temperature') %}
        {% set condition = states('sensor.playaweather_weather') %}
        {% if current not in ['unknown', 'unavailable'] %}
          {{ current }}°F - {{ condition }}
        {% else %}
          No data
        {% endif %}
      icon: >
        {% set condition = states('sensor.playaweather_weather') %}
        {% if 'clear' in condition|lower %}
          mdi:weather-sunny
        {% elif 'cloud' in condition|lower %}
          mdi:weather-cloudy
        {% elif 'rain' in condition|lower %}
          mdi:weather-rainy
        {% else %}
          mdi:weather-partly-cloudy
        {% endif %}

###############################################################################
# AUTOMATIONS
###############################################################################
automation:
  - id: weather_update_schedule
    alias: "Weather - Every 4 hours"
    description: "Update weather context every 4 hours"
    trigger:
      - platform: time_pattern
        hours: "/4"
      - platform: state
        entity_id: input_button.update_weather_context
    action:
      - service: script.weather_context_update
      - service: system_log.write
        data:
          message: "Weather context updated (scheduled)"
          level: info
