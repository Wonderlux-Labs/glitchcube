# Weather Package - Everything weather-related in one place!

###############################################################################
# INPUT HELPERS
###############################################################################
input_text:
  weather_forecast_24h:
    name: 24 Hour Weather Forecast
    initial: "No forecast available"
    max: 255

  weather_forecast_5day:
    name: 5 Day Weather Forecast
    initial: "No forecast available"
    max: 255

input_button:
  update_weather_context:
    name: Update Weather Context
    icon: mdi:weather-partly-cloudy

###############################################################################
# TEMPLATE SENSORS
###############################################################################
template:
  - sensor:
      - name: "Weather Summary"
        state: >
          {% set current = states('sensor.playaweather_temperature') %}
          {% set condition = states('sensor.playaweather_weather') %}
          {% if current not in ['unknown', 'unavailable'] %}
            {{ current }}°F - {{ condition }}
          {% else %}
            No data
          {% endif %}
        icon: >
          {% set condition = states('sensor.playaweather_weather') %}
          {% if 'clear' in condition|lower %}
            mdi:weather-sunny
          {% elif 'cloud' in condition|lower %}
            mdi:weather-cloudy
          {% elif 'rain' in condition|lower %}
            mdi:weather-rainy
          {% else %}
            mdi:weather-partly-cloudy
          {% endif %}

      - name: "Weather Alert Status"
        state: >
          {% set temp = states('sensor.playaweather_temperature')|float(-999) %}
          {% if temp > 100 %}
            extreme_heat
          {% elif temp < 40 %}
            cold_warning
          {% elif states('sensor.playaweather_wind_speed')|float(0) > 30 %}
            wind_advisory
          {% else %}
            normal
          {% endif %}

###############################################################################
# AUTOMATIONS
###############################################################################
automation:
  - id: weather_update_schedule
    alias: "Weather - Scheduled Update"
    description: "Update weather context every 4 hours"
    trigger:
      - platform: time_pattern
        hours: "/4"
    action:
      - service: script.update_all_weather_context
      - service: system_log.write
        data:
          message: "Weather context updated (scheduled)"
          level: info

  - id: weather_manual_update
    alias: "Weather - Manual Update"
    description: "Update weather when button pressed"
    trigger:
      - platform: state
        entity_id: input_button.update_weather_context
    action:
      - service: script.update_all_weather_context
      - service: notify.persistent_notification
        data:
          title: "🌤️ Weather Updated"
          message: "Weather forecast has been refreshed"

  - id: weather_extreme_alert
    alias: "Weather - Extreme Conditions Alert"
    description: "Alert on extreme weather conditions"
    trigger:
      - platform: numeric_state
        entity_id: sensor.playaweather_temperature
        above: 100
      - platform: numeric_state
        entity_id: sensor.playaweather_temperature
        below: 40
      - platform: numeric_state
        entity_id: sensor.playaweather_wind_speed
        above: 30
    action:
      - service: notify.persistent_notification
        data:
          title: "⚠️ Extreme Weather Alert"
          message: >
            {% set temp = states('sensor.playaweather_temperature')|float(-999) %}
            {% set wind = states('sensor.playaweather_wind_speed')|float(0) %}
            {% if temp > 100 %}
              Extreme heat warning: {{ temp }}°F
            {% elif temp < 40 %}
              Cold warning: {{ temp }}°F
            {% elif wind > 30 %}
              High wind advisory: {{ wind }}mph
            {% endif %}

###############################################################################
# SCRIPTS
###############################################################################
script:
  update_weather_24h:
    alias: "Update Weather Context - Next 24 Hours"
    mode: single
    sequence:
      # Get hourly forecast first
      - service: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.playaweather
        response_variable: hourly_forecast
      
      # Use Claude to summarize with ALL available weather data
      - service: conversation.process
        data:
          agent_id: conversation.claude_conversation
          text: >-
            Summarize weather for next 24h in a few concise sentences including currently"
            Current conditions:
            - Temp: {{ states('sensor.playaweather_temperature') }}°F (feels like {{ states('sensor.playaweather_feels_like_temperature') }}°F)
            - Condition: {{ states('sensor.playaweather_weather') }}
            - Humidity: {{ states('sensor.playaweather_humidity') }}%
            - Pressure: {{ states('sensor.playaweather_pressure') }} hPa
            - Wind: {{ states('sensor.playaweather_wind_speed') }}mph from {{ states('sensor.playaweather_wind_bearing') }}°
            - Visibility: {{ states('sensor.playaweather_visibility') }}mi
            - UV Index: {{ states('sensor.playaweather_uv_index') }}
            - Cloud cover: {{ states('sensor.playaweather_cloud_coverage') }}%
            - Dew point: {{ states('sensor.playaweather_dew_point') }}°F
            - Rain: {{ states('sensor.playaweather_rain') }}mm
            - Snow: {{ states('sensor.playaweather_snow') }}mm
            {% set hours = hourly_forecast['weather.playaweather'].forecast %}
            Next 24h (every 6h): 
            Now: {{ hours[0].temperature }}°F {{ hours[0].condition }};
            +6h: {{ hours[6].temperature }}°F {{ hours[6].condition }};
            +12h: {{ hours[12].temperature }}°F {{ hours[12].condition }};
            +18h: {{ hours[18].temperature }}°F {{ hours[18].condition }}
        response_variable: weather_24h
      
      # Store in input_text
      - service: input_text.set_value
        target:
          entity_id: input_text.weather_forecast_24h
        data:
          value: "{{ weather_24h.response.speech.plain.speech[:255] }}"

  update_weather_5day:
    alias: "Update Weather Context - 5 Day Forecast"
    mode: single
    sequence:
      # Get daily forecast first
      - service: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.playaweather
        response_variable: daily_forecast
      
      # Use Claude to summarize
      - service: conversation.process
        data:
          agent_id: conversation.claude_conversation
          text: >-
            Summarize 5-day weather forecast in a concise way:
            {% set days = daily_forecast['weather.playaweather'].forecast[:5] %}
            {% for day in days %}
            Day {{ loop.index }}: {{ day.temperature }}°F/{{ day.templow }}°F, {{ day.condition }}
            {% endfor %}
        response_variable: weather_5day
      
      # Store in input_text
      - service: input_text.set_value
        target:
          entity_id: input_text.weather_forecast_5day
        data:
          value: "{{ weather_5day.response.speech.plain.speech[:255] }}"

  update_all_weather_context:
    alias: "Update All Weather Context"
    mode: single
    sequence:
      - service: script.update_weather_24h
      - delay:
          seconds: 2
      - service: script.update_weather_5day