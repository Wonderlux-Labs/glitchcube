# Conversation Package - Everything conversation-related in one place!

###############################################################################
# INPUT HELPERS
###############################################################################
input_boolean:
  debug_mode:
    name: Debug Mode
    initial: false
    icon: mdi:bug

  record_conversations:
    name: Record Conversations
    initial: true
    icon: mdi:record-rec

  conversation_active:
    name: Conversation Active
    initial: false
    icon: mdi:microphone-message

input_text:
  conversation_state:
    name: Conversation State
    initial: idle
    max: 32

  last_error:
    name: Last Error
    initial: none
    max: 255

  current_track:
    name: Current Track
    initial: "No music playing"
    max: 255

  current_persona:
    name: Current Persona
    initial: "Buddy"
    max: 32
    icon: mdi:robot
    
input_number:
  active_conversation_count:
    name: Active Conversation Count
    initial: 0
    min: 0
    max: 100

###############################################################################
# AUTOMATIONS
###############################################################################
automation:
  - id: conversation_started
    alias: "Conversation - Started"
    description: "Track when conversation starts"
    trigger:
      - platform: state
        entity_id: input_boolean.conversation_active
        from: "off"
        to: "on"
    action:
      - service: input_number.increment
        target:
          entity_id: input_number.active_conversation_count
      - service: input_text.set_value
        target:
          entity_id: input_text.conversation_state
        data:
          value: "active"
      - service: counter.increment
        target:
          entity_id: counter.daily_conversations

  - id: conversation_ended
    alias: "Conversation - Ended"
    description: "Track when conversation ends"
    trigger:
      - platform: state
        entity_id: input_boolean.conversation_active
        from: "on"
        to: "off"
    action:
      - service: input_number.decrement
        target:
          entity_id: input_number.active_conversation_count
      - service: input_text.set_value
        target:
          entity_id: input_text.conversation_state
        data:
          value: "idle"

  - id: persona_update
    alias: "Conversation - Update Persona Display"
    description: "Update displays when persona changes"
    trigger:
      - platform: state
        entity_id: input_text.current_persona
    action:
      - service: script.awtrix_control
        data:
          text: "{{ trigger.to_state.state }} mode"
          icon: "53288"
          duration: 5

  - id: update_current_persona_webhook
    alias: "Conversation - Update Current Persona via Webhook"
    description: "Update persona from webhook"
    trigger:
      - platform: webhook
        webhook_id: "glitchcube_persona"
        allowed_methods:
          - POST
        local_only: false
    condition:
      - condition: template
        value_template: "{{ trigger.data.persona is defined }}"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.current_persona
        data:
          value: "{{ trigger.data.persona }}"
      - service: logbook.log
        data:
          name: "Glitch Cube"
          message: "Persona changed to {{ trigger.data.persona }}"
          
  - id: glitchcube_tts_automation
    alias: "Conversation - GlitchCube TTS"
    description: "Text to speech automation"
    trigger:
      - platform: webhook
        webhook_id: glitchcube_tts
        allowed_methods:
          - POST
    action:
      - service: script.glitchcube_tts_queued
        data:
          message: "{{ trigger.data.message }}"

###############################################################################
# SCRIPTS
###############################################################################
script:
  glitchcube_tts_queued:
    alias: "GlitchCube TTS Queued"
    mode: queued
    max: 10
    sequence:
      - service: tts.speak
        data:
          entity_id: media_player.glitchcube_speaker
          message: "{{ message }}"
          options:
            voice: >
              {% set persona = states('input_text.current_persona') %}
              {% if persona == 'Buddy' %}
                en-US-Standard-B
              {% elif persona == 'Jax' %}
                en-US-Standard-A
              {% elif persona == 'Lomi' %}
                en-US-Standard-C
              {% elif persona == 'Zorp' %}
                en-US-Standard-D
              {% else %}
                en-US-Standard-B
              {% endif %}

  speak_with_persona:
    alias: "Speak with Current Persona"
    mode: single
    sequence:
      - service: script.glitchcube_tts_queued
        data:
          message: "{{ message }}"

  interaction_time:
    alias: "Log Interaction Time"
    mode: single
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.last_interaction_time
        data:
          value: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"