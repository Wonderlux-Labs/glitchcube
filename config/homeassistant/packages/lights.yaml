# Lights Package - LED control, Awtrix display, and lighting effects

###############################################################################
# INPUT HELPERS
###############################################################################
input_text:
  current_environment:
    name: Current Environment
    initial: "normal"
    max: 32
    icon: mdi:palette
    
  camera_vision_analysis:
    name: Camera Vision Analysis
    initial: "No analysis available"
    max: 255
    icon: mdi:camera-iris

###############################################################################
# TEMPLATE SENSORS
###############################################################################
template:
  - sensor:
      - name: "Display Status"
        state: >
          {% if is_state('light.awtrix_light', 'on') %}
            Active
          {% else %}
            Idle
          {% endif %}
        icon: >
          {% if is_state('light.awtrix_light', 'on') %}
            mdi:led-on
          {% else %}
            mdi:led-off
          {% endif %}

###############################################################################
# AUTOMATIONS
###############################################################################
automation:
  - id: ring_light_status
    alias: "Lights - Ring Light Status Indicator"
    description: "Update ring lights based on system status"
    trigger:
      - platform: state
        entity_id:
          - assist_satt
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.conversation_active
                state: "on"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.govee_ring_light
                data:
                  rgb_color: [0, 255, 0]  # Green for active
                  brightness: 200
          - conditions:
              - condition: state
                entity_id: input_boolean.maintenance_mode
                state: "on"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.govee_ring_light
                data:
                  rgb_color: [255, 165, 0]  # Orange for maintenance
                  brightness: 150
          - conditions:
              - condition: state
                entity_id: input_boolean.offline_mode
                state: "on"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.govee_ring_light
                data:
                  rgb_color: [255, 0, 0]  # Red for offline
                  brightness: 100
        default:
          - service: light.turn_on
            target:
              entity_id: light.govee_ring_light
            data:
              rgb_color: [0, 0, 255]  # Blue for idle
              brightness: 50

  - id: camera_vision_analysis
    alias: "Lights - Camera Vision Analysis Display"
    description: "Display camera analysis on Awtrix"
    trigger:
      - platform: state
        entity_id: input_text.camera_vision_analysis
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != 'No analysis available' }}"
    action:
      - service: script.awtrix_control
        data:
          text: "{{ trigger.to_state.state[:32] }}"
          icon: "3303"
          duration: 8

###############################################################################
# SCRIPTS
###############################################################################
script:
  awtrix_control:
    alias: "Awtrix Display Control"
    mode: queued
    max: 5
    fields:
      text:
        description: "Text to display"
        example: "Hello World"
      icon:
        description: "Icon ID to display"
        example: "1234"
      color:
        description: "Text color in hex"
        example: "FF0000"
      duration:
        description: "Display duration in seconds"
        example: 10
      rainbow:
        description: "Enable rainbow effect"
        example: false
    sequence:
      - service: mqtt.publish
        data:
          topic: "awtrix/custom/notification"
          payload: >
            {
              "text": "{{ text }}",
              {% if icon is defined %}
              "icon": "{{ icon }}",
              {% endif %}
              {% if color is defined %}
              "color": "{{ color }}",
              {% else %}
              "color": "FFFFFF",
              {% endif %}
              {% if rainbow is defined and rainbow %}
              "rainbow": true,
              {% endif %}
              "duration": {{ duration | default(5) }}
            }

  cube_dashboard_actions:
    alias: "Cube Dashboard Actions"
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ action == 'show_status' }}"
            sequence:
              - service: script.awtrix_control
                data:
                  text: >
                    {% if is_state('input_boolean.offline_mode', 'on') %}
                      OFFLINE
                    {% elif is_state('input_boolean.maintenance_mode', 'on') %}
                      MAINTENANCE
                    {% else %}
                      ONLINE
                    {% endif %}
                  icon: "52159"
                  duration: 5
          - conditions:
              - condition: template
                value_template: "{{ action == 'show_weather' }}"
            sequence:
              - service: script.awtrix_control
                data:
                  text: "{{ states('sensor.weather_temperature') }}°C"
                  icon: "2315"
                  duration: 5
          - conditions:
              - condition: template
                value_template: "{{ action == 'show_persona' }}"
            sequence:
              - service: script.awtrix_control
                data:
                  text: "{{ states('input_text.current_persona') }}"
                  icon: "53288"
                  duration: 5

  light_show:
    alias: "Light Show Effect"
    mode: single
    sequence:
      - repeat:
          count: 5
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.govee_strip
              data:
                rgb_color: [255, 0, 0]
                brightness: 255
            - delay:
                milliseconds: 500
            - service: light.turn_on
              target:
                entity_id: light.govee_strip
              data:
                rgb_color: [0, 255, 0]
                brightness: 255
            - delay:
                milliseconds: 500
            - service: light.turn_on
              target:
                entity_id: light.govee_strip
              data:
                rgb_color: [0, 0, 255]
                brightness: 255
            - delay:
                milliseconds: 500
      - service: light.turn_on
        target:
          entity_id: light.govee_strip
        data:
          rgb_color: [255, 255, 255]
          brightness: 100

  welcome_animation:
    alias: "Welcome Animation"
    mode: single
    sequence:
      - service: script.awtrix_control
        data:
          text: "HELLO HUMAN!"
          icon: "53288"
          rainbow: true
          duration: 5
      - service: script.light_show
      - service: script.speak_with_persona
        data:
          message: "Welcome! I'm {{ states('input_text.current_persona') }}. How can I help you today?"